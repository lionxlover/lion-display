# LDP capture module — output frame snapshots for tools and remote sessions.
#
# The read-once snapshot shape: a client binds the global capture manager,
# asks for the current frame, and receives a whole-file memfd with the
# compositor's scanout content. The same relay vocabulary that ships keymaps
# and ICC profiles (read-once snapshots) carries frames across the remote
# transport unchanged, so a remote client captures exactly what a local one
# does.

[module]
name = "ldp.capture"
version_min = 1
version_max = 1
doc = """
Output frame capture: the client-facing surface behind screenshots and
remote mirroring. Binding the global capture manager and sending `grab`
yields one `frame` event whose descriptor is a read-once snapshot of the
output's current content — premultiplied ARGB8888 words, `width` x
`height`, row-major, exactly the scanout a display would present. The
capture never tears (the snapshot is taken between frames) and never
blocks the frame pipeline (the content is copied out under the render
lock, not mapped from live scanout).
"""

[[import]]
interface = "ldp.core.connection"

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

[[enum]]
name = "capture_error"
doc = "Why a grab could not produce a frame."
[enum.values]
out_of_memory = 1
no_output = 2         # every output is gone (the dark state); retry after a display returns

# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

[[interface]]
name = "capture_manager"
global = true
doc = """
The global entry point for output capture. One `grab` request produces at
most one event: `frame` on success, `failed` on a resource error. The
snapshot descriptor is read-once shared memory: read it to EOF (the size
is `width * height * 4` bytes) and keep or drop it — the compositor never
mutates a shipped frame.
"""

[[interface.request]]
name = "grab"
doc = """
Capture the output's current frame. The reply arrives as a `frame` event
(or `failed`); there is no reply event declared on the request because
the snapshot is fire-and-forget — grabbing again is always allowed and
never coalesced.
"""

[[interface.event]]
name = "frame"
doc = """
One captured frame. The FD is a read-only snapshot: `width * height * 4`
bytes of premultiplied ARGB8888 words in native byte order, row-major,
top-to-bottom. Un-premultiply for straight-alpha consumers (the dump
convention: composited over opaque black).
"""
args = [
  { name = "fd", type = "fd", doc = "The frame snapshot descriptor (read whole)." },
  { name = "width", type = "uint32", doc = "Frame width in pixels." },
  { name = "height", type = "uint32", doc = "Frame height in pixels." },
]

[[interface.event]]
name = "failed"
doc = "The grab could not be served; no frame event will arrive for it."
args = [
  { name = "reason", type = "enum", of = "capture_error" },
]
