<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="LDP drawn chrome desktop">
  <title>LDP — the desktop, drawn (SSD, Minimal tier)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#0C1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#3385FF" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#3385FF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#3385FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="winShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="dockShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="680" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="13.5" fill="none" stroke="#232A35" stroke-width="1"/>
  <rect x="0" y="0" width="1200" height="680" rx="14" fill="url(#glow)"/>

  <!-- header -->
  <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1" fill="#E6EAF2">The desktop, drawn</text>
  <text x="1160" y="40" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6B7484">SSD · the Minimal tier · logical metrics @ 1×</text>

  <!-- window B (behind) -->
  <g filter="url(#winShadow)">
    <rect x="660" y="100" width="380" height="250" rx="12" fill="#1A1F27" stroke="#39414D" stroke-width="1.5"/>
    <path d="M672 100 h356 a12 12 0 0 1 12 12 v30 h-380 v-30 a12 12 0 0 1 12 -12 z" fill="#232A35"/>
    <line x1="660" y1="142" x2="1040" y2="142" stroke="#2A313C" stroke-width="1"/>
    <circle cx="1005" cy="121" r="15" fill="#E2654E"/>
    <path d="M999 115 l12 12 M1011 115 l-12 12" stroke="#16181D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="678" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#C7CDD9">Beta — pointer-paint</text>
    <!-- paint strokes -->
    <path d="M710 190 q40 -24 84 8 t96 18" fill="none" stroke="#3385FF" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <path d="M720 250 q64 34 128 -12" fill="none" stroke="#E2654E" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <path d="M880 170 q28 62 -8 118" fill="none" stroke="#9AA3B2" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <path d="M760 300 q90 -30 180 14" fill="none" stroke="#4A5464" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- window A (front) -->
  <g filter="url(#winShadow)">
    <rect x="150" y="170" width="560" height="370" rx="12" fill="#1A1F27" stroke="#39414D" stroke-width="1.5"/>
    <path d="M162 170 h536 a12 12 0 0 1 12 12 v30 h-560 v-30 a12 12 0 0 1 12 -12 z" fill="#232A35"/>
    <line x1="150" y1="212" x2="710" y2="212" stroke="#2A313C" stroke-width="1"/>
    <circle cx="672" cy="192" r="15" fill="#E2654E"/>
    <path d="M666 186 l12 12 M678 186 l-12 12" stroke="#16181D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="168" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#E6EAF2">Alpha — hello-ldp</text>
    <!-- content -->
    <text x="186" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#E6EAF2">hello, LDP</text>
    <rect x="186" y="290" width="330" height="10" rx="5" fill="#2A313C"/>
    <rect x="186" y="312" width="288" height="10" rx="5" fill="#2A313C"/>
    <rect x="186" y="334" width="304" height="10" rx="5" fill="#232A35"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9AA3B2">
      <rect x="186" y="372" width="92" height="28" rx="8" fill="#20262F" stroke="#39414D"/>
      <text x="232" y="390" text-anchor="middle">shell</text>
      <rect x="290" y="372" width="92" height="28" rx="8" fill="#20262F" stroke="#39414D"/>
      <text x="336" y="390" text-anchor="middle">seats</text>
      <rect x="394" y="372" width="92" height="28" rx="8" fill="#20262F" stroke="#39414D"/>
      <text x="440" y="390" text-anchor="middle">color</text>
    </g>
    <rect x="186" y="430" width="176" height="40" rx="10" fill="#3385FF"/>
    <text x="274" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">frame_target</text>
    <rect x="390" y="430" width="176" height="40" rx="10" fill="#20262F" stroke="#39414D"/>
    <text x="478" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9AA3B2">attach + fence</text>
  </g>

  <!-- dock -->
  <g filter="url(#dockShadow)">
    <rect x="540" y="596" width="400" height="56" rx="16" fill="#1D232C" fill-opacity="0.95" stroke="#2A313C"/>
    <g>
      <rect x="582" y="606" width="36" height="36" rx="9" fill="#12233C" fill-opacity="0.8" stroke="#3385FF"/>
      <rect x="638" y="606" width="36" height="36" rx="9" fill="#232A35" stroke="#39414D"/>
      <rect x="694" y="606" width="36" height="36" rx="9" fill="#232A35" stroke="#39414D"/>
      <rect x="750" y="606" width="36" height="36" rx="9" fill="#232A35" stroke="#39414D"/>
      <rect x="806" y="606" width="36" height="36" rx="9" fill="#232A35" stroke="#39414D"/>
      <rect x="862" y="606" width="36" height="36" rx="9" fill="#232A35" stroke="#39414D"/>
    </g>
    <circle cx="600" cy="652" r="2.5" fill="#3385FF"/>
  </g>

  <!-- callout chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600">
    <circle cx="152" cy="146" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="152" y="150" text-anchor="middle" fill="#7FA8E8">1</text>
    <circle cx="430" cy="191" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="430" y="195" text-anchor="middle" fill="#7FA8E8">2</text>
    <circle cx="630" cy="191" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="630" y="195" text-anchor="middle" fill="#7FA8E8">3</text>
    <circle cx="134" cy="300" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="134" y="304" text-anchor="middle" fill="#7FA8E8">4</text>
    <circle cx="134" cy="420" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="134" y="424" text-anchor="middle" fill="#7FA8E8">5</text>
    <circle cx="518" cy="624" r="11" fill="#0F1319" stroke="#3385FF" stroke-width="1.5"/>
    <text x="518" y="628" text-anchor="middle" fill="#7FA8E8">6</text>
  </g>

  <!-- legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9AA3B2">
    <text x="60" y="576"><tspan fill="#7FA8E8" font-weight="700">1</tspan>  caption band — the move grip (28 px @ 1×)</text>
    <text x="60" y="599"><tspan fill="#7FA8E8" font-weight="700">2</tspan>  title glyph — Lion Sans, the compositor's own face</text>
    <text x="60" y="622"><tspan fill="#7FA8E8" font-weight="700">3</tspan>  close capsule — press arms, release fires</text>
    <text x="60" y="645"><tspan fill="#7FA8E8" font-weight="700">4</tspan>  border ring — 1 px @ 1×</text>
    <text x="60" y="668"><tspan fill="#7FA8E8" font-weight="700">5</tspan>  the client's ink rides inside the frame</text>
    <text x="290" y="645"><tspan fill="#7FA8E8" font-weight="700">6</tspan>  the dock — frosted, rises on a spring</text>
  </g>
</svg>
