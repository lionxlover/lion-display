<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="LDP frame pipeline">
  <title>LDP — deterministic frame scheduling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="1" stop-color="#0C1016"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5464"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="250" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="13.5" fill="none" stroke="#232A35" stroke-width="1"/>

  <!-- header -->
  <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1" fill="#E6EAF2">The frame, one deterministic pass</text>
  <text x="1160" y="40" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6B7484">clients never ask “may I draw?” — the server pushes deadlines</text>

  <!-- nodes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- 1 · frame_target (accent) -->
    <rect x="40" y="72" width="136" height="64" rx="10" fill="#12233C" fill-opacity="0.55" stroke="#3385FF" stroke-opacity="0.6"/>
    <text x="108" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#E6EAF2">frame_target</text>
    <text x="108" y="118" text-anchor="middle" font-size="11.5" fill="#9AA3B2">deadline · pushed</text>

    <!-- 2 · client renders -->
    <rect x="204" y="72" width="136" height="64" rx="10" fill="#161C25" stroke="#2A313C"/>
    <text x="272" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EAF2">client renders</text>
    <text x="272" y="118" text-anchor="middle" font-size="11.5" fill="#6B7484">against the clock</text>

    <!-- 3 · attach + fence -->
    <rect x="368" y="72" width="136" height="64" rx="10" fill="#161C25" stroke="#2A313C"/>
    <text x="436" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EAF2">attach + fence</text>
    <text x="436" y="118" text-anchor="middle" font-size="11.5" fill="#6B7484">explicit sync</text>

    <!-- 4 · damage -->
    <rect x="532" y="72" width="136" height="64" rx="10" fill="#161C25" stroke="#2A313C"/>
    <text x="600" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EAF2">damage</text>
    <text x="600" y="118" text-anchor="middle" font-size="11.5" fill="#6B7484">coalesced per frame</text>

    <!-- 5 · scheduler -->
    <rect x="696" y="72" width="136" height="64" rx="10" fill="#161C25" stroke="#2A313C"/>
    <text x="764" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EAF2">scheduler</text>
    <text x="764" y="118" text-anchor="middle" font-size="11.5" fill="#6B7484">per-output clock</text>

    <!-- 6 · composite -->
    <rect x="860" y="72" width="136" height="64" rx="10" fill="#161C25" stroke="#2A313C"/>
    <text x="928" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EAF2">composite</text>
    <text x="928" y="118" text-anchor="middle" font-size="11.5" fill="#6B7484">GL · planes · SW</text>

    <!-- 7 · atomic flip (accent) -->
    <rect x="1024" y="72" width="136" height="64" rx="10" fill="#12233C" fill-opacity="0.55" stroke="#3385FF" stroke-opacity="0.6"/>
    <text x="1092" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#E6EAF2">atomic flip</text>
    <text x="1092" y="118" text-anchor="middle" font-size="11.5" fill="#9AA3B2">lands on vblank</text>
  </g>

  <!-- arrows -->
  <g stroke="#4A5464" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="176" y1="104" x2="200" y2="104"/>
    <line x1="340" y1="104" x2="364" y2="104"/>
    <line x1="504" y1="104" x2="528" y2="104"/>
    <line x1="668" y1="104" x2="692" y2="104"/>
    <line x1="832" y1="104" x2="856" y2="104"/>
    <line x1="996" y1="104" x2="1020" y2="104"/>
  </g>

  <!-- vblank pulses -->
  <g stroke="#3385FF" stroke-opacity="0.7" stroke-width="1.5" fill="none">
    <path d="M1030 156 v10 h10 v-10 h8 v10 h10 v-10 h8 v10 h10 v-10 h8 v10 h10 v-10 h8 v10 h10 v-10 h8 v10 h10 v-10 h8 v10 h10 v-10"/>
  </g>
  <text x="1100" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#4A5464" letter-spacing="1">VBLANK</text>

  <!-- the quiet arm, centered -->
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7484">A quiet scene parks frame requests and lets the panel sleep (PSR); hidden windows stop receiving targets.</text>

  <!-- refresh chip -->
  <g>
    <rect x="510" y="194" width="180" height="24" rx="8" fill="#161C25" stroke="#2A313C"/>
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9AA3B2">60 / 120 / 144 / 240 Hz+ · VRR</text>
  </g>
</svg>
